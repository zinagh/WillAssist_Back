spring.datasource.url=jdbc:mysql://localhost:3306/messenger-managementdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

chat.bot-base-url=http://localhost:8000
# server name
spring.application.name=messenger-management
spring.cloud.config.enabled=false

# server configuration
server.port=0
MIN_PORT=8081
Max_PORT=65000
server.servlet.context-path=/messenger




#jwt jwk issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri= http://localhost:8080/realms/teamw
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

## JWT conversion
principle-attribute=preferred_username
resourceId=realm_access


#eureka configuration
eureka.instance.hostname=localhost
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.registry-fetch-interval-seconds=10
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=10